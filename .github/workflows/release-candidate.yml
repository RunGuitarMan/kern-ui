name: Prepare and publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version (for example, 1.2.0 or 1.2.0-rc.1)
        required: true
        type: string
      npm_dist_tag:
        description: npm distribution tag; prereleases must use next
        required: true
        default: next
        type: choice
        options:
          - next
          - latest
      publication_auth:
        description: Use bootstrap-token only for the first registry publication
        required: true
        default: trusted-publishing
        type: choice
        options:
          - trusted-publishing
          - bootstrap-token

permissions: {}

concurrency:
  group: kern-release
  cancel-in-progress: false

env:
  CI: true
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_TAG: ${{ github.ref_name }}
  RELEASE_COMMIT: ${{ github.sha }}
  NPM_DIST_TAG: ${{ inputs.npm_dist_tag }}
  NPM_STAGING_TAG: kern-staging

jobs:
  package:
    name: Validate and assemble immutable candidate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact_name: ${{ steps.artifact-name.outputs.value }}

    steps:
      - name: Check out the selected release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Validate tag, version, and default-branch ancestry
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          node -e '
            const { readFileSync } = require("node:fs");
            const requested = process.env.RELEASE_VERSION;
            const angular = JSON.parse(readFileSync("projects/kern/package.json", "utf8"));
            const mcp = JSON.parse(readFileSync("projects/kern-mcp/package.json", "utf8"));
            const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?$/;
            if (!semver.test(requested)) throw new Error(`Invalid release version: ${requested}`);
            if (process.env.RELEASE_REF_TYPE !== "tag") {
              throw new Error("Dispatch the workflow from the exact release tag, not a branch.");
            }
            if (process.env.RELEASE_TAG !== `v${requested}`) {
              throw new Error(`Expected tag v${requested}, received ${process.env.RELEASE_TAG}`);
            }
            if (angular.version !== requested || mcp.version !== requested) {
              throw new Error(
                `Requested ${requested}, but package sources are ` +
                  `${angular.name}@${angular.version} and ${mcp.name}@${mcp.version}`,
              );
            }
            if (requested.includes("-") && process.env.NPM_DIST_TAG === "latest") {
              throw new Error("Prereleases cannot use the latest npm distribution tag.");
            }
          '
          git merge-base --is-ancestor "$RELEASE_COMMIT" "origin/$DEFAULT_BRANCH"

      - name: Install dependencies
        run: npm ci

      - name: Verify release documentation identity
        run: |
          node tools/verify-kern-release-identity.mjs \
            "--version=${RELEASE_VERSION}" \
            "--tag=${RELEASE_TAG}"

      - name: Validate one-time npm bootstrap eligibility
        if: inputs.publication_auth == 'bootstrap-token'
        run: node tools/verify-kern-npm-bootstrap.mjs "--version=${RELEASE_VERSION}"

      - name: Verify lifecycle and evidence governance
        run: |
          mkdir -p release
          node tools/attest-kern-lifecycle-release.mjs \
            "--version=${RELEASE_VERSION}" \
            "--tag=${RELEASE_TAG}" \
            "--commit=${RELEASE_COMMIT}" \
            --output=release/lifecycle-attestation.json
          node tools/verify-kern-lifecycle.mjs \
            --mode=release \
            --release-attestation=release/lifecycle-attestation.json
          node tools/verify-kern-accessibility-evidence.mjs --mode=pre-1-release
          node tools/verify-kern-package-policy.mjs
          node --test tools/tests/kern-governance.test.mjs

      - name: Run release quality gate
        run: npm run verify

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run the complete Playwright suite
        run: npm run test:e2e

      - name: Run the mobile and touch browser tier
        run: npm run test:mobile-touch

      - name: Validate built package version
        run: |
          node -e '
            const { readFileSync } = require("node:fs");
            const packages = ["dist/kern/package.json", "dist/kern-mcp/package.json"].map((path) =>
              JSON.parse(readFileSync(path, "utf8")),
            );
            for (const built of packages) {
              if (built.version !== process.env.RELEASE_VERSION) {
                throw new Error(
                  `Requested ${process.env.RELEASE_VERSION}, but built package is ` +
                    `${built.name}@${built.version}`,
                );
              }
            }
          '

      - name: Build immutable versioned SSR documentation
        run: |
          npx nx build docs \
            --configuration production \
            "--base-href=/versions/${RELEASE_VERSION}/" \
            --output-path dist/versioned-docs

      - name: Smoke-test the versioned SSR mount
        run: |
          node tools/smoke-kern-versioned-docs.mjs \
            "--input-dir=dist/versioned-docs" \
            "--base-path=/versions/${RELEASE_VERSION}/"

      - name: Pack the exact npm tarballs
        run: |
          mkdir -p release
          npm pack ./dist/kern --pack-destination release
          npm pack ./dist/kern-mcp --pack-destination release

      - name: Prepare deterministic documentation archive and file manifest
        run: |
          node tools/verify-kern-versioned-docs.mjs prepare \
            "--version=${RELEASE_VERSION}" \
            "--tag=${RELEASE_TAG}" \
            "--commit=${RELEASE_COMMIT}" \
            "--base-path=/versions/${RELEASE_VERSION}/" \
            "--input-dir=dist/versioned-docs" \
            "--artifact-dir=release"

      - name: Materialize the pinned Angular dependency graph and enforce vulnerability policy
        run: |
          node tools/prepare-kern-release-lock.mjs \
            --manifest=dist/kern/package.json \
            --output=dist/kern/package-lock.json
          npm audit --prefix dist/kern --package-lock-only --omit=dev --audit-level=high

      - name: Generate Angular package CycloneDX SBOM
        working-directory: dist/kern
        run: |
          npm sbom --package-lock-only --sbom-format cyclonedx --sbom-type library > \
            "../../release/kern-ui-angular-${RELEASE_VERSION}.cdx.json"

      - name: Materialize the pinned MCP dependency graph and enforce vulnerability policy
        run: |
          node tools/prepare-kern-release-lock.mjs \
            --manifest=dist/kern-mcp/package.json \
            --output=dist/kern-mcp/package-lock.json
          npm audit --prefix dist/kern-mcp --package-lock-only --omit=dev --audit-level=high

      - name: Generate MCP package CycloneDX SBOM
        working-directory: dist/kern-mcp
        run: |
          npm sbom --package-lock-only --sbom-format cyclonedx --sbom-type library > \
            "../../release/kern-ui-mcp-${RELEASE_VERSION}.cdx.json"

      - name: Bind packages, documentation, SBOMs, tag, commit, and checksums
        run: |
          node tools/verify-kern-release-artifacts.mjs prepare \
            "--version=${RELEASE_VERSION}" \
            "--tag=${RELEASE_TAG}" \
            "--commit=${RELEASE_COMMIT}" \
            "--npm-tag=${NPM_DIST_TAG}" \
            "--artifact-dir=release"

      - name: Define immutable artifact name
        id: artifact-name
        run: echo "value=kern-packages-${RELEASE_VERSION}-${RELEASE_COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Upload immutable release candidate
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact-name.outputs.value }}
          path: release/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Approve and publish trusted artifact
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: npm-production
      url: https://www.npmjs.com/package/@kern-ui/angular/v/${{ inputs.version }}
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node for npm trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install release tooling dependencies
        run: npm ci --ignore-scripts

      - name: Download the approved candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: release

      - name: Reverify tag linkage, documentation, policy, and SHA256 checksums
        run: |
          node tools/verify-kern-release-identity.mjs \
            "--version=${RELEASE_VERSION}" \
            "--tag=${RELEASE_TAG}"
          node tools/verify-kern-release-artifacts.mjs verify \
            "--version=${RELEASE_VERSION}" \
            "--tag=${RELEASE_TAG}" \
            "--commit=${RELEASE_COMMIT}" \
            "--npm-tag=${NPM_DIST_TAG}" \
            "--artifact-dir=release"

      - name: Stage exact tarballs with npm OIDC provenance
        if: inputs.publication_auth == 'trusted-publishing'
        run: |
          node tools/publish-kern-release-package.mjs \
            --package=@kern-ui/angular \
            "--version=${RELEASE_VERSION}" \
            "--tarball=release/kern-ui-angular-${RELEASE_VERSION}.tgz" \
            "--staging-tag=${NPM_STAGING_TAG}"
          node tools/publish-kern-release-package.mjs \
            --package=@kern-ui/mcp \
            "--version=${RELEASE_VERSION}" \
            "--tarball=release/kern-ui-mcp-${RELEASE_VERSION}.tgz" \
            "--staging-tag=${NPM_STAGING_TAG}"

      - name: Bootstrap exact first-release tarballs with npm provenance
        if: inputs.publication_auth == 'bootstrap-token'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          node tools/verify-kern-npm-bootstrap.mjs "--version=${RELEASE_VERSION}"
          node tools/publish-kern-release-package.mjs \
            --package=@kern-ui/angular \
            "--version=${RELEASE_VERSION}" \
            "--tarball=release/kern-ui-angular-${RELEASE_VERSION}.tgz" \
            "--staging-tag=${NPM_STAGING_TAG}"
          node tools/publish-kern-release-package.mjs \
            --package=@kern-ui/mcp \
            "--version=${RELEASE_VERSION}" \
            "--tarball=release/kern-ui-mcp-${RELEASE_VERSION}.tgz" \
            "--staging-tag=${NPM_STAGING_TAG}"

      - name: Verify both staged integrities and promote public tags with rollback
        env:
          NODE_AUTH_TOKEN: ${{ inputs.publication_auth == 'bootstrap-token' && secrets.NPM_BOOTSTRAP_TOKEN || secrets.NPM_DIST_TAG_TOKEN }}
        run: |
          node tools/promote-kern-release.mjs \
            "--version=${RELEASE_VERSION}" \
            "--tag=${NPM_DIST_TAG}" \
            "--staging-tag=${NPM_STAGING_TAG}" \
            "--angular-tarball=release/kern-ui-angular-${RELEASE_VERSION}.tgz" \
            "--mcp-tarball=release/kern-ui-mcp-${RELEASE_VERSION}.tgz"

      - name: Verify synchronized npm distribution tags
        run: |
          node tools/verify-kern-release-dist-tags.mjs \
            "--version=${RELEASE_VERSION}" \
            "--tag=${NPM_DIST_TAG}"

      - name: Verify registry manifests, provenance, tarballs, and public tags
        run: |
          node tools/verify-kern-published-release.mjs \
            "--version=${RELEASE_VERSION}" \
            "--tag=${NPM_DIST_TAG}" \
            "--angular-tarball=release/kern-ui-angular-${RELEASE_VERSION}.tgz" \
            "--mcp-tarball=release/kern-ui-mcp-${RELEASE_VERSION}.tgz"

      - name: Publish GitHub release with evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "release/SHA256SUMS" \
              "release/lifecycle-attestation.json" \
              "release/release-manifest.json" \
              "release/kern-docs-${RELEASE_VERSION}.manifest.json" \
              "release/kern-docs-${RELEASE_VERSION}.tgz" \
              "release/kern-ui-angular-${RELEASE_VERSION}.cdx.json" \
              "release/kern-ui-angular-${RELEASE_VERSION}.tgz" \
              "release/kern-ui-mcp-${RELEASE_VERSION}.cdx.json" \
              "release/kern-ui-mcp-${RELEASE_VERSION}.tgz" \
              --clobber
            gh release edit "$RELEASE_TAG" --draft=false
          else
            gh release create "$RELEASE_TAG" \
              "release/SHA256SUMS" \
              "release/lifecycle-attestation.json" \
              "release/release-manifest.json" \
              "release/kern-docs-${RELEASE_VERSION}.manifest.json" \
              "release/kern-docs-${RELEASE_VERSION}.tgz" \
              "release/kern-ui-angular-${RELEASE_VERSION}.cdx.json" \
              "release/kern-ui-angular-${RELEASE_VERSION}.tgz" \
              "release/kern-ui-mcp-${RELEASE_VERSION}.cdx.json" \
              "release/kern-ui-mcp-${RELEASE_VERSION}.tgz" \
              --generate-notes \
              --title "Kern ${RELEASE_TAG}" \
              --verify-tag
          fi
