version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-eslint/*'
          - ng-packagr
      playwright:
        patterns:
          - '@playwright/*'
          - '@axe-core/*'
          - axe-core
      typescript-tooling:
        patterns:
          - typescript
          - typescript-eslint
          - eslint

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:30'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
