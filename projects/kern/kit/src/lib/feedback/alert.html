@if (visible()) {
  <section
    class="alert"
    [attr.data-tone]="tone()"
    [attr.data-appearance]="appearance()"
    [attr.role]="tone() === 'danger' ? 'alert' : 'status'"
    [attr.aria-live]="tone() === 'danger' ? 'assertive' : 'polite'"
  >
    <span class="indicator" aria-hidden="true">
      <ng-content select="[krnAlertIcon]" />
      <span class="indicator-fallback">{{ icon() || toneIcon() }}</span>
    </span>
    <div class="content">
      @if (title()) {
        <strong>{{ title() }}</strong>
      }
      <div class="body"><ng-content /></div>
      <div class="actions"><ng-content select="[krnAlertAction]" /></div>
    </div>
    @if (dismissible()) {
      <button
        type="button"
        class="dismiss"
        [attr.aria-label]="resolvedDismissLabel()"
        (click)="dismiss()"
      >
        <span aria-hidden="true">×</span>
      </button>
    }
  </section>
}
